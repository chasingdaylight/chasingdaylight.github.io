<extend template="base.shtml">
<head id="head">
  <title :text="$page.title.suffix(' · ', $site.title)"></title>
</head>
<main id="desktop">
  <article class="window" aria-labelledby="page-title">
    <div class="title-bar">
      <h1 class="title-bar-text" id="page-title" :text="$page.title"></h1>
      <div class="title-bar-controls" aria-hidden="true">
        <button aria-label="Minimize" tabindex="-1"></button>
        <button aria-label="Maximize" tabindex="-1"></button>
        <button aria-label="Close" tabindex="-1"></button>
      </div>
    </div>
    <div class="window-body">
      <ctx :if="$page.custom.get?('logo')"><img class="$page.custom.getOr('logo_style', 'logo')" src="$site.asset($if).link()" alt=""></ctx>
      <p class="lead" :text="$page.description"></p>
      <div class="content" :html="$page.content()"></div>
      <p class="buttons">
        <ctx :if="$page.custom.get?('website')"><a class="btn" href="$if">Website</a></ctx>
        <a class="btn" href="$page.custom.get('source')">Source</a>
        <a class="btn" href="$site.page('projects').link()">All projects</a>
      </p>
    </div>
    <div class="status-bar">
      <p class="status-bar-field" :text="$page.custom.get('language')"></p>
      <p class="status-bar-field" :text="$page.date.format('Started January 2006')"></p>
    </div>
  </article>
</main>
