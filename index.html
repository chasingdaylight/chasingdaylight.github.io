<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chasing Daylight</title>
  <meta name="description" content="A developer who is always chasing daylight. Open source software.">
  <style>
    :root {
      --bg: #fbf7f1;
      --fg: #1d1b19;
      --muted: #6b645c;
      --accent: #c2410c;
      --rule: #e4dbcf;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151312;
        --fg: #f1ebe3;
        --muted: #a39a8f;
        --accent: #fb923c;
        --rule: #2e2a26;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      font: 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: 100%;
      max-width: 38rem;
      padding: 3rem 1.25rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 7vw, 3rem);
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .tagline { margin: 0 0 2.5rem; color: var(--muted); }
    h2 {
      margin: 0 0 0.75rem;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    ul { list-style: none; margin: 0 0 2.5rem; padding: 0; border-top: 1px solid var(--rule); }
    li { padding: 0.9rem 0; border-bottom: 1px solid var(--rule); }
    li p { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.9375rem; }
    a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 0.2em; }
    a:hover { text-decoration-thickness: 2px; }
    footer { color: var(--muted); font-size: 0.9375rem; }
  </style>
</head>
<body>
  <main>
    <h1>Chasing Daylight</h1>
    <p class="tagline">A developer who is always chasing daylight.</p>

    <h2>Projects</h2>
    <ul>
      <li>
        <a href="https://github.com/chasingdaylight/skein">skein</a>
        <p>Requirements, specifications and traceability as plain text in git.</p>
      </li>
    </ul>

    <footer>
      More on <a href="https://github.com/chasingdaylight">GitHub</a>.
    </footer>
  </main>
</body>
</html>
